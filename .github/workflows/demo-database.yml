name: Prepare demo database

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Create synthetic sample records if missing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: demo-database
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: demo
    defaults:
      run:
        working-directory: src/backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.demo
      DJANGO_SECRET_KEY: ${{ secrets.DEMO_DJANGO_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
      REDIS_URL: redis://unused-during-migrations:6379/0
      ALLOWED_HOSTS: ${{ vars.DEMO_RENDER_HOST }}
      FRONTEND_URL: ${{ vars.DEMO_FRONTEND_URL }}
      DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
      DEMO_DENTIST_PASSWORD: ${{ secrets.DEMO_DENTIST_PASSWORD }}
      DEMO_RECEPTION_PASSWORD: ${{ secrets.DEMO_RECEPTION_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock
      - run: python manage.py check --deploy
      - run: python manage.py migrate --noinput
      - run: python manage.py migrate --check
      - if: inputs.seed
        run: python manage.py seed_demo
      - run: python manage.py flushexpiredtokens
